version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cps_postgres
    environment:
      POSTGRES_DB: cps_dev
      POSTGRES_USER: cps
      POSTGRES_PASSWORD: cps_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cps -d cps_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
